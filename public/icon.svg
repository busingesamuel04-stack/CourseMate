<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="50%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#090A0E" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4" />

  <!-- Inner ambient glow circle -->
  <circle cx="256" cy="256" r="160" fill="#6366F1" opacity="0.18" filter="url(#glow)" />

  <!-- Stylized Academic Graduation Cap / Geometric Motif -->
  <g transform="translate(256, 175) scale(0.9)">
    <polygon points="0,-48 120,0 0,48 -120,0" fill="url(#accentGrad)" />
    <path d="M -60,18 L -60,60 C -60,84 60,84 60,60 L 60,18" fill="none" stroke="#A5B4FC" stroke-width="12" stroke-linecap="round" />
    <!-- Tassel -->
    <path d="M 96,10 L 96,75 C 96,82 104,88 110,88" fill="none" stroke="#F43F5E" stroke-width="8" stroke-linecap="round" />
    <circle cx="110" cy="94" r="7" fill="#F43F5E" />
  </g>

  <!-- Bold "C" Symbol -->
  <text x="256" y="380" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="160" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">C</text>
  <circle cx="340" cy="360" r="12" fill="#8B5CF6" />
</svg>
